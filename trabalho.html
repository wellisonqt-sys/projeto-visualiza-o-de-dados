<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataHub Escolar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#0d6efd;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.box{
    background:#ffffff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.box h2{
    color:#0d6efd;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0d6efd;
    color:white;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<h1>📊 DataHub Escolar</h1>

<div class="container">

    <div class="card">
        <h2>Cadastro de Alunos</h2>
        <br>

        <form id="formAluno">

            <input type="text" id="nome" placeholder="Nome" required>

            <input type="number" id="idade" placeholder="Idade" required>

            <input type="text" id="curso" placeholder="Curso" required>

            <input type="number" step="0.1" id="nota" placeholder="Nota" required>

            <button type="submit">Salvar</button>

        </form>
    </div>

    <div class="dashboard">

        <div class="box">
            <h2 id="total">0</h2>
            <p>Total de Alunos</p>
        </div>

        <div class="box">
            <h2 id="media">0</h2>
            <p>Média Geral</p>
        </div>

        <div class="box">
            <h2 id="maior">0</h2>
            <p>Maior Nota</p>
        </div>

        <div class="box">
            <h2 id="menor">0</h2>
            <p>Menor Nota</p>
        </div>

    </div>

    <br>

    <div class="card">

        <h2>Dados Cadastrados</h2>

        <br>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Nota</th>
                </tr>
            </thead>

            <tbody id="tabela">
            </tbody>

        </table>

        <div class="actions">

            <button onclick="exportarCSV()">
                Exportar CSV
            </button>

            <button onclick="limparDados()">
                Limpar Dados
            </button>

        </div>

    </div>

</div>

<script>

let alunos = [];

const form = document.getElementById("formAluno");

form.addEventListener("submit", function(e){

    e.preventDefault();

    let nome = document.getElementById("nome").value.trim();
    let idade = Number(document.getElementById("idade").value);
    let curso = document.getElementById("curso").value.trim();
    let nota = Number(document.getElementById("nota").value);

    if(!nome || !curso){
        alert("Preencha todos os campos");
        return;
    }

    if(nota < 0 || nota > 10){
        alert("Nota inválida");
        return;
    }

    alunos.push({
        nome,
        idade,
        curso,
        nota
    });

    atualizarTabela();
    atualizarDashboard();

    form.reset();

});

function atualizarTabela(){

    let tabela = document.getElementById("tabela");

    tabela.innerHTML = "";

    alunos.forEach(aluno => {

        tabela.innerHTML += `
        <tr>
            <td>${aluno.nome}</td>
            <td>${aluno.idade}</td>
            <td>${aluno.curso}</td>
            <td>${aluno.nota}</td>
        </tr>
        `;

    });

}

function atualizarDashboard(){

    document.getElementById("total").textContent = alunos.length;

    if(alunos.length === 0){

        document.getElementById("media").textContent = 0;
        document.getElementById("maior").textContent = 0;
        document.getElementById("menor").textContent = 0;

        return;
    }

    let notas = alunos.map(a => a.nota);

    let media =
        notas.reduce((a,b)=>a+b,0) /
        notas.length;

    document.getElementById("media").textContent =
        media.toFixed(2);

    document.getElementById("maior").textContent =
        Math.max(...notas);

    document.getElementById("menor").textContent =
        Math.min(...notas);

}

function exportarCSV(){

    let csv =
    "Nome,Idade,Curso,Nota\n";

    alunos.forEach(a=>{

        csv += `${a.nome},${a.idade},${a.curso},${a.nota}\n`;

    });

    let blob = new Blob([csv],
    {type:"text/csv"});

    let url =
    URL.createObjectURL(blob);

    let link =
    document.createElement("a");

    link.href = url;
    link.download = "dados_alunos.csv";
    link.click();

}

function limparDados(){

    if(confirm("Deseja apagar todos os dados?")){

        alunos = [];

        atualizarTabela();
        atualizarDashboard();

    }

}
</script>

</body>
</html>
